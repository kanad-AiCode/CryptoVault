spring.application.name=CryptoVault
spring.datasource.url=jdbc:mysql://localhost:3306/cryptovault_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

bitcoin.rpc.url=http://127.0.0.1:48332
bitcoin.rpc.cookie-path=${user.home}/AppData/Local/Bitcoin/testnet4/.cookie
bitcoin.rpc.wallet=cryptovault-test
bitcoin.rpc.max-test-amount=0.0001
bitcoin.rpc.fee-rate-sat-vb=2